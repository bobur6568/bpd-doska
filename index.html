<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPD Doskasi — Ta'minot bo'limi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="root">
    <div class="boot-screen">
      <div class="boot-spinner"></div>
      <div class="boot-text" id="boot-text">Yuklanmoqda...</div>
    </div>
  </div>
  <script>
    try {
      var _bpdLang = localStorage.getItem("bpd_lang");
      var _bpdBoot = { uz: "Yuklanmoqda...", en: "Loading...", ru: "Загрузка..." };
      if (_bpdLang && _bpdBoot[_bpdLang]) {
        document.getElementById("boot-text").textContent = _bpdBoot[_bpdLang];
        document.documentElement.lang = _bpdLang;
      }
    } catch (e) { /* localStorage unavailable */ }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
